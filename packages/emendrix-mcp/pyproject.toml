[project]
name = "emendrix-mcp"
version = "0.1.0"
description = "A read-only MCP server over a published emendrix changelogs repository."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependencies are added with `uv add --package emendrix-mcp`, never with `pip`. The
# member never depends on `emendrix`: the server must not be able to import the explain stage.
dependencies = [
    # Every model of the published record and the reader of its files; a workspace member that
    # depends on `pydantic` only.
    "emendrix-record",
    # Capped below 2.3 because 2.3.0 requires `httpx2>=2.10`, which would move a package the
    # pipeline's model stage resolves (through `genai-prices`) and its pinned figures run on.
    "mcp>=2.2.0,<2.3",
    "pydantic>=2.13.4",
    # The streamable-HTTP transport is a Starlette app served by uvicorn. `mcp` pulls both in;
    # they are named here because `emendrix_mcp.app` imports them itself.
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emendrix_mcp"]

[tool.uv.sources]
emendrix-record = { workspace = true }
