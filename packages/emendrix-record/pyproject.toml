[project]
name = "emendrix-record"
version = "0.1.0"
description = "The published emendrix record as a reader sees it: its models and a safe file reader."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependencies are added with `uv add --package emendrix-record`, never with `pip`. The
# member never depends on `emendrix` and reads only published files: every reader beside the
# pipeline goes through it, so none of them can reach the pipeline's model stage.
dependencies = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emendrix_record"]
