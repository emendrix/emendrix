[project]
name = "emendrix-service"
version = "0.1.0"
description = "The account service beside emendrix: email watchlists over the published change record."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependencies are added with `uv add --package emendrix-service`, never with `pip`. The
# member never depends on `emendrix`: it reads the published record through `emendrix-record`
# and cannot import the pipeline's model stage.
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    # Used only by `ops/ship.py`, which uploads an encrypted backup over SFTP.
    "asyncssh>=2.24.1",
    # The one reader of the published record; the service reads the record through it only.
    "emendrix-record",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    # The SQLAlchemy dialect `postgresql+psycopg`, with its compiled build and connection pool.
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Used only by `ops/ship.py`, which encrypts a backup to an `age` recipient before upload.
    "pyrage>=1.4.0",
    # What FastAPI parses a posted HTML form with.
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.27.1",
    # A slim image carries no system time zone database, and digests fall due in a named zone.
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
emendrix-service = "emendrix_service.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emendrix_service"]

[tool.uv.sources]
emendrix-record = { workspace = true }
