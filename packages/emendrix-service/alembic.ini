# For developers only: the service configures Alembic in code (`db/migrate.py`) and the image
# carries no ini file. This one points the `alembic` command at a scratch database, so the next
# revision can be generated against the models:
#
#     docker run --rm -e POSTGRES_PASSWORD=x -p 5433:5432 postgres:17-alpine
#     cd packages/emendrix-service
#     uv run alembic upgrade head
#     uv run alembic revision --autogenerate --rev-id 0002 -m "what the revision adds"
#
# Read the generated file before trusting it, then run the service's database tests, which hold
# the migrations and the models equal.

[alembic]
script_location = %(here)s/src/emendrix_service/db/migrations
sqlalchemy.url = postgresql+psycopg://postgres:x@localhost:5433/postgres
version_table_schema = notify
file_template = %%(rev)s_%%(slug)s
