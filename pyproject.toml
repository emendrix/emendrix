[project]
name = "emendrix"
version = "0.1.0"
description = "A regulatory change engine: watch EU legislation, diff it provision by provision, explain what changed."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martins Erts" }]
keywords = ["eur-lex", "eu-law", "regulatory-change", "diff", "changelog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Runtime dependencies are added with `uv add`, never with `pip`.
dependencies = [
    # Every XML document this project reads came off a socket, and the stdlib parser expands
    # internal entities. `emendrix.eu.xml_` is the only module allowed to import it.
    "defusedxml>=0.7.1",
    # The HTTP client and the cache directory of `emendrix.eu.http` / `emendrix.eu.cache`,
    # the only two modules in the package allowed to touch either.
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "platformdirs>=4.11.0",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic,openai]>=2.25.0",
    # `ExplainSettings`' env overrides, declared beside the fields they set. Its default of
    # reading the process on every construction is switched off there; see that module.
    "pydantic-settings>=2.14",
    "typer>=0.27.1",
]

# `Homepage` is the generated site rather than the source repository: a reader arriving from a
# package index wants the changelogs and the measured numbers before they want the code.
[project.urls]
Homepage = "https://emendrix.symber.net"
Repository = "https://github.com/emendrix/emendrix"
Changelog = "https://github.com/emendrix/emendrix/blob/main/CHANGELOG.md"
Issues = "https://github.com/emendrix/emendrix/issues"

[project.scripts]
emendrix = "emendrix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emendrix"]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "types-defusedxml>=0.7.0.20260504",
    "pytest-xdist>=3.8.0",
    # Only `scripts/make_og_image.py` imports it, to regenerate the committed link-preview
    # card. The site build copies that PNG's bytes and rasterises nothing, so no module under
    # `src/emendrix/` may import `PIL` and the wheel's runtime deps stay free of it.
    "pillow>=12.3.0",
]

# --- ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# Defaults on purpose: formatting is not a place to have opinions.

# --- mypy ---------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
# `mypy` with no arguments checks exactly what CI and the local gate check.
files = ["src", "tests"]
# `scripts/validation/` is one-off validation code outside the package, exempt
# (see scripts/validation/README.md). Excluded explicitly so it stays out even if
# it is ever passed on the command line.
exclude = ["^scripts/"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Live-network tests are opt-in: `uv run pytest -m live`. CI never touches the network.
# `record` rewrites committed cassettes, so it is opt-in for a second reason: a default run
# must never mutate an artifact the rest of the suite asserts against.
# `-n auto` because the suite is CPU-bound: measured 2026-08-12 over 1173 tests on a 10-core
# machine, 205s serially against 81s on eight workers, the same count passing either way.
# `--dist loadscope` is part of the setting rather than decoration, because
# `tests/eval`, `tests/explain` and `tests/site_` hang tens of seconds off module-scoped
# fixtures, and a distribution that splits a module across workers pays for them twice.
# `-n0` turns it off for one run, which is how a failure gets read: workers interleave output, and
# a test that passes serially but fails in parallel is a finding about shared state, not a flake.
addopts = "-m 'not live and not record' --strict-markers --strict-config -n auto --dist loadscope"
markers = [
    "live: hits real network endpoints; excluded by default and in CI",
    "record: rewrites committed cassettes under tests/cassettes; excluded by default and in CI",
]

# --- coverage -----------------------------------------------------------------
[tool.coverage.run]
source = ["src/emendrix"]
branch = true
