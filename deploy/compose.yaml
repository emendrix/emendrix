# Reference deployment: a web server that serves a directory of files, a read-only MCP server
# behind it, and two one-shot jobs.
#
# There is no scheduler container. The schedule is **host cron**, calling `docker compose run`,
# and that is a decision rather than an omission: a scheduler service is a third image to keep
# patched, a second place a failure can hide, and a thing to debug at the moment the feed
# endpoint changes. Host cron writes to syslog, is already monitored on any machine that has a
# machine's worth of monitoring, and is the tool the operator already knows.
#
#   17 * * * * cd /srv/emendrix && docker compose run --rm poller && docker compose run --rm page
#
# The README's "Running it on a server" section is the runbook: what runs when, which volumes
# hold what, what breaks when the notification endpoint moves, and how to re-run a missed window.
#
#   cp .env.example .env                      # then set EMENDRIX_PUBLIC_HOST to your own host
#   docker compose build
#   docker compose up -d web mcp              # the site, the record at /api/v1/, MCP at /mcp
#   docker compose run --rm poller            # one poll → diff → explain → gate → commit
#   docker compose run --rm page              # regenerate the static site
#
# Configuration: `deploy/.env`, which is gitignored and never baked into an image, and which
# `deploy/.env.example` documents. `EMENDRIX_PUBLIC_HOST` is required: it is the one place the
# deployment's host is named, so the site's links, its feeds' ids, the catalogue the MCP server
# reads and the hosts that server answers cannot name two different places, and compose refuses
# to start without it rather than build a site that links to someone else's. Secrets:
# `OPENROUTER_API_KEY` (or `ANTHROPIC_API_KEY`) comes from the same file. Without one the explain
# stage cannot run live; the deterministic half of the loop does not need it.

name: emendrix

services:
  web:
    # Pinned by manifest-list digest for the reason `deploy/Dockerfile`'s header gives: a tag
    # moves, and the tag in front of the digest is for a reader, not for docker. Resolved
    # 2026-08-09 with `docker buildx imagetools inspect nginx:1.27-alpine`.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - site:/usr/share/nginx/html:ro
      # One directive, so that nginx's own trailing-slash redirect stays path-relative and cannot
      # send an `https://` reader to an `http://` URL behind a TLS-terminating proxy. The file says
      # why; it drops in beside the image's own `default.conf` and replaces nothing, so serving a
      # directory as its `index.html`, which the generated tree relies on, is still the upstream
      # config's job. Editing it means recreating this container, since nginx reads its
      # configuration at startup.
      - ./absolute-redirect.conf:/etc/nginx/conf.d/absolute-redirect.conf:ro
      # The server block is owned here rather than left to the image, because it is where the
      # recorded half of the API is routed: `/api/v1/` answers the root index, the act indexes
      # and the payloads straight from the changelogs volume below, so nothing is copied into
      # the site and nothing is rewritten on an hourly build. The file is the image's own with
      # two locations added and says so in its header. When the digest above moves, read the new
      # image's `default.conf` and carry those changes onto it, because this mount hides whatever
      # the new image changed in its own copy.
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only, because a web server has no business writing the record it serves, and the
      # poller is the one writer of that repository.
      - changelogs:/srv/changelogs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    # nginx resolves the `/mcp` upstream once, when it starts, and refuses to start if it
    # cannot, so the server it proxies to is started first. It keeps that address, so after
    # `mcp` is recreated `docker compose restart web` points it at the new container.
    depends_on:
      - mcp

  # The MCP server, answering streamable HTTP at `/mcp` through `web`: stateless, keyless and
  # read-only over the same record and the catalogue the site build writes. It publishes no
  # port of its own; `web` reaches it on the compose network. It is configured only through its
  # environment, and it answers only requests naming one of `EMENDRIX_MCP_ALLOWED_HOSTS`: the
  # public host, and `localhost:8080` for a reader trying the deployment on the machine itself.
  mcp:
    build:
      context: ..
      dockerfile: packages/emendrix-mcp/Dockerfile
    image: ghcr.io/emendrix/emendrix-mcp:0.1.0
    restart: unless-stopped
    environment:
      EMENDRIX_MCP_CHANGELOGS: /srv/changelogs
      EMENDRIX_MCP_CATALOGUE: /srv/site/api/v1/catalogue.json
      EMENDRIX_MCP_ALLOWED_HOSTS: "${EMENDRIX_PUBLIC_HOST:?set EMENDRIX_PUBLIC_HOST in deploy/.env (see .env.example)},localhost:8080"
    volumes:
      - changelogs:/srv/changelogs:ro
      - site:/srv/site:ro
    read_only: true

  # One poll of the notification feed, end to end, ending in a commit in the changelog
  # repository. Exits when it is done: this is a cron job, not a daemon.
  poller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The registry name the release carries, and the tag the `build:` stanza above writes locally,
    # so `page` below has an image whether the operator built from a clone or pulled a published
    # one. A version rather than a moving tag: what a moving tag means changes under a deployment
    # that has not been redeployed. Only `:<short sha>` and `:main` are pushed on every gated
    # commit (`.github/workflows/publish.yml`), so a version tag is a build or a release, never
    # something that appeared on its own.
    image: ghcr.io/emendrix/emendrix:0.1.0
    env_file:
      - path: .env
        required: false
    environment:
      EMENDRIX_OUTPUT_REPO: /work/changelogs
    volumes:
      - changelogs:/work/changelogs
      - cache:/home/emendrix/.cache
      - state:/home/emendrix/.local/share
      - ./watchlist.toml:/work/watchlist.toml:ro
    command: ["run", "--once"]

  # The public site, rebuilt from what the poller committed plus the reports baked into the
  # image. Reads only; it fetches nothing and needs no key.
  #
  # `--site-url` is the deployment's own address and the one fact the generator cannot infer.
  # A feed's links and entry IDs are absolute by definition, so without it no feed file is
  # written at all and `/feeds/` says why. It is built from `EMENDRIX_PUBLIC_HOST` in
  # `deploy/.env`: change it there when the site moves, and nowhere else. `--repo-url` is the
  # public home of the source, the same for every deployment, and `--changelogs-url`, from
  # `EMENDRIX_CHANGELOGS_URL`, is where this deployment publishes its changelog data: with a
  # value every page's footer links that repository, and left empty the footer names the data
  # in plain words rather than linking someone else's.
  # The watchlist is read from `/work/watchlist.toml`, the default relative to the image's
  # `WORKDIR`, which is the file mounted below.
  # `--watch-state` points at the file the poller keeps its own record in, on the same volume
  # the poller writes it to and mounted read-only here: with it the about page says the date the
  # corpus was last checked and how many consolidations are waiting for their text. A build that
  # finds nothing there says nothing about polling and writes every other page unchanged.
  # `--comparison-cache` keeps the before/after comparisons between builds, in `comparisons/`
  # beside the HTTP response cache's `emendrix/` on the same disposable volume, which is why
  # `cache` is mounted here and mounted writable. It changes how long a build takes, never what
  # it writes, and deleting the directory costs one slow build.
  page:
    image: ghcr.io/emendrix/emendrix:0.1.0
    volumes:
      - changelogs:/work/changelogs:ro
      - site:/work/site
      - cache:/home/emendrix/.cache
      - state:/home/emendrix/.local/share:ro
      - ./watchlist.toml:/work/watchlist.toml:ro
    command:
      - "site"
      - "build"
      - "--out"
      - "/work/site"
      - "--changelogs"
      - "/work/changelogs"
      - "--report-dir"
      - "/app/reports/eval"
      - "--site-url"
      - "https://${EMENDRIX_PUBLIC_HOST:?set EMENDRIX_PUBLIC_HOST in deploy/.env (see .env.example)}"
      - "--repo-url"
      - "https://github.com/emendrix/emendrix"
      - "--changelogs-url"
      - "${EMENDRIX_CHANGELOGS_URL:-}"
      - "--watch-state"
      - "/home/emendrix/.local/share/emendrix/watch-state.json"
      - "--comparison-cache"
      - "/home/emendrix/.cache/comparisons"

volumes:
  changelogs:  # the output git repository: yours, never pushed by emendrix
  site:        # the generated site: pages, feeds, the search index and its script
  cache:       # the HTTP response cache and the site's comparisons; disposable, rebuilt on demand
  state:       # the watcher's seen-state cursor; NOT disposable
