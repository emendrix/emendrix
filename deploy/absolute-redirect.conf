# nginx builds its own trailing-slash redirect from the scheme it can see. Behind a proxy that
# terminates TLS and forwards plain HTTP that scheme is `http`, so a reader who opened an
# `https://` directory URL is answered with an `http://` one and makes a single unencrypted
# request before the site recovers. Turning `absolute_redirect` off makes the redirect
# path-relative: it names no scheme, host or port, so it stays right whether the site is served
# over TLS, over plain HTTP on a workstation, or both.
#
# A file of its own rather than an edit of the image's `default.conf`, because
# `/etc/nginx/nginx.conf` ends its `http` block with `include /etc/nginx/conf.d/*.conf` and
# `absolute_redirect` is valid at `http` level, so this inherits into the server block and changes
# nothing else. Serving a directory as its `index.html`, which the generated tree of `index.html`
# files relies on, stays the upstream config's behaviour.
absolute_redirect off;
