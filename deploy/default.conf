# The pinned image's own `/etc/nginx/conf.d/default.conf`, read out of it on 2026-10-08 with
# `docker run --rm <the image in compose.yaml> cat /etc/nginx/conf.d/default.conf`, with
# `error_page 404` uncommented and the two `/api/v1/` locations added. Mounted over the image's
# file, so a move of the image digest means reading that file again and carrying these changes
# onto it.
server {
    listen       80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # The recorded half of the API, served from the changelogs volume as committed. The pattern
    # admits the root index, the act indexes and the payloads, and nothing else: no .git, no
    # CHANGELOG.md, no directory listing. Every segment opens with a letter or a digit, which
    # every name `output/json_out.py`'s `slug` writes does, so no dot-file is reachable.
    #
    # `add_header` in a location replaces every header the enclosing levels add rather than
    # adding to them, so a deployment whose `http` or `server` block sets headers must repeat
    # them in both locations below. A plain `GET` is a CORS simple request, so no `OPTIONS`
    # handling is needed.
    location ~ ^/api/v1/(index\.json|[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/index\.json|[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/changes/[A-Za-z0-9][A-Za-z0-9._-]*\.json)$ {
        alias /srv/changelogs/$1;
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The derived half, the catalogue and the schemas, which the site build writes into its own
    # tree. A regular expression location is tried before this prefix, so the recorded files
    # above never reach it; it exists to give the site's files the same CORS header.
    location /api/v1/ {
        root   /usr/share/nginx/html;
        charset utf-8;
        charset_types application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
