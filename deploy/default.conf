# The pinned image's own `/etc/nginx/conf.d/default.conf`, read out of it on 2026-10-08 with
# `docker run --rm <the image in compose.yaml> cat /etc/nginx/conf.d/default.conf`, with
# `error_page 404` uncommented, the two `/api/v1/` locations, the `/mcp` location and the
# `/account/` and `/u/` locations added, and the discovery locations after `/mcp` (the server
# card, the two well-known catalogs, the bare `/api/v1/` and the home page's `Link` header).
# Mounted over the image's file, so a move of the image digest means reading that file again and
# carrying these changes onto it.
server {
    listen       80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # The recorded half of the API, served from the changelogs volume as committed. The pattern
    # admits the root index, the act indexes and registers, and the payloads, and nothing else:
    # no .git, no CHANGELOG.md, no directory listing. Every segment opens with a letter or a
    # digit, which every name `output/json_out.py`'s `slug` writes does, so no dot-file is
    # reachable.
    #
    # `add_header` in a location replaces every header the enclosing levels add rather than
    # adding to them, so a deployment whose `http` or `server` block sets headers must repeat
    # them in both locations below. A plain `GET` is a CORS simple request, so no `OPTIONS`
    # handling is needed.
    location ~ ^/api/v1/(index\.json|[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/(?:index|register)\.json|[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/changes/[A-Za-z0-9][A-Za-z0-9._-]*\.json)$ {
        alias /srv/changelogs/$1;
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The derived half, the catalogue and the schemas, which the site build writes into its own
    # tree. A regular expression location is tried before this prefix, so the recorded files
    # above never reach it; it exists to give the site's files the same CORS header.
    location /api/v1/ {
        root   /usr/share/nginx/html;
        charset utf-8;
        charset_types application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The MCP endpoint, proxied to the `mcp` service, which answers every request with one JSON
    # response and holds no session, so any request can reach any replica. Only `POST` is
    # meaningful, and the server, not this block, says so for the other methods. `$http_host` is
    # the Host the client sent, port included, which is what the server's allowed hosts list:
    # `$host` drops the port, so `localhost:8080` could never match. Buffering is off so the
    # answer is passed on as the server writes it, and the body cap is far above any tool call.
    #
    # `expires off` keeps a lifetime an enclosing level sets off these answers, which are
    # computed per request. As above, a deployment whose `http` or `server` block adds headers
    # must repeat them here, because this block's own `add_header` replaces them. The two below
    # stand for that set; a browser honours HSTS only over https and ignores it on a plain port.
    location = /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_buffering off;
        client_max_body_size 64k;
        expires off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The MCP server card, which the `mcp` service serves at the endpoint's path plus
    # `/server-card`; the exact `/mcp` location above does not match it. Unlike `/mcp`, there is
    # no `expires off`, because the server sends its own `Cache-Control` and `ETag` and that
    # directive would override them; no CORS `add_header`, because the server sends the CORS
    # headers itself and a second `Access-Control-Allow-Origin` makes a browser reject the
    # response; and buffering stays on, since the answer is a few hundred bytes. Every method
    # passes through and the server answers `OPTIONS` and `HEAD` itself.
    #
    # This block and the four after it each declare `add_header`, so each inherits none: a
    # deployment whose `http` or `server` block adds headers repeats that set in all five, and a
    # header added at `server` level here must be added to each of them too.
    location = /mcp/server-card {
        proxy_pass http://mcp:8000/mcp/server-card;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        client_max_body_size 1k;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The API catalog (RFC 9727) that the site build writes. The file has no extension, so
    # without `default_type` it would go out as `application/octet-stream`, and the RFC requires
    # the Linkset media type. No `profile` parameter is added: the document carries its own.
    # `charset_types` must name the type, or `charset` is silently not applied to it.
    location = /.well-known/api-catalog {
        root   /usr/share/nginx/html;
        default_type application/linkset+json;
        charset utf-8;
        charset_types application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The AI catalog the site build writes, served as `application/ai-catalog+json`. Its `.json`
    # extension maps to `application/json` through the image's `mime.types`, and `default_type`
    # is only consulted when no extension matches, so the empty `types` clears that map here.
    location = /.well-known/ai-catalog.json {
        root   /usr/share/nginx/html;
        types { }
        default_type application/ai-catalog+json;
        charset utf-8;
        charset_types application/ai-catalog+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The bare API directory answers with the root index instead of the directory's 403. A
    # rewrite rather than `return 302`: an agent that sends `GET /api/v1/` gets the data in one
    # request, and the URL it used keeps working. The rewrite re-enters location matching and
    # lands on the recorded half's pattern, so the index is served from the volume with that
    # block's headers; it cannot loop, because the target is not this exact location.
    location = /api/v1/ {
        rewrite ^ /api/v1/index.json last;
    }

    # The home page, which carries the `api-catalog` link relation (RFC 9727) where an agent
    # starts. `index` answers `GET /` with an internal redirect to `/index.html`, which matching
    # re-enters, so this exact location serves both `/` and `/index.html`; in `location /` the
    # header would ride on every page and asset instead.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The optional account service (`docs/accounts.md`), proxied when the compose profile
    # `accounts` runs it. The upstream is a variable, so nginx resolves it per request through
    # Docker's embedded DNS (127.0.0.11) rather than once at start-up: without the profile this
    # file still loads, everything else is served as before, and only these two prefixes answer
    # 502. `/account/` holds the pages that use the session cookie; `/u/` the token-addressed
    # endpoints that never read it (unsubscribe, the personal feed, the mail provider's hook).
    #
    # The service sends its own Content-Security-Policy, which allows its forms to post to it.
    # These blocks therefore declare their own header set and leave a CSP out of it: a policy
    # inherited from an enclosing level would be sent beside the service's, and a browser
    # enforces both, so a `form-action 'none'` there would block every form here.
    #
    # `X-Emendrix-Client-IP` carries the client address the service rate-limits by, and is set,
    # never passed through, so a client cannot choose it. `$remote_addr` is the client only
    # when nothing sits in front of nginx; behind a TLS-terminating proxy or tunnel that sends a
    # client-address header of its own, put that header's variable here instead (for example
    # `$http_cf_connecting_ip`), and make sure nothing but that proxy reaches this server.
    location /account/ {
        resolver 127.0.0.11 valid=30s;
        set $account http://account:8000;
        proxy_pass $account;
        proxy_set_header Host $http_host;
        proxy_set_header X-Emendrix-Client-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 64k;
        expires off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # As above. Paths under `/u/` carry secrets (an unsubscribe token, a feed token, the hook's
    # path secret), so they are not written to the access log. The bodies posted here (a
    # one-click unsubscribe, form-encoded or multipart, and the provider's JSON events) pass
    # through as sent, within the same cap.
    location /u/ {
        access_log off;
        resolver 127.0.0.11 valid=30s;
        set $account http://account:8000;
        proxy_pass $account;
        proxy_set_header Host $http_host;
        proxy_set_header X-Emendrix-Client-IP $remote_addr;
        proxy_http_version 1.1;
        client_max_body_size 64k;
        expires off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
